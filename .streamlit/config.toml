[theme]
base = "dark"
primaryColor = "#C8A25A"
backgroundColor = "#0C1017"
secondaryBackgroundColor = "#1A2331"
textColor = "#EDE6D8"
font = "sans serif"

[server]
headless = true
# Serves the scene images in static/ at app/static/.
enableStaticServing = true
# The file watcher inspects every loaded module on each rerun; with
# transformers loaded that raises hundreds of harmless torchvision errors and
# slows the app down. Restart `streamlit run app.py` after editing the code.
fileWatcherType = "none"
